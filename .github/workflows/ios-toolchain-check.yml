name: iOS Toolchain Check

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - ".github/workflows/ios-toolchain-check.yml"

permissions:
  contents: read

jobs:
  ios-toolchain:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check CMake and Ninja
        run: |
          cmake --version
          ninja --version

      - name: Check iOS compiler
        run: |
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos clang --version

      - name: Check repository state
        run: |
          git submodule status
          test -f CMakeLists.txt
          test -f src/host_posix.c
          echo "iOS toolchain check passed."
          echo "This job checks the toolchain only; it does not build the game."
