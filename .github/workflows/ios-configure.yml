name: iOS CMake Configure

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - ".github/workflows/ios-configure.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja molten-vk shaderc

      - name: Configure runtime-only build for iOS
        run: |
          cmake -S . -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEFJAM_BUILD_GAME=OFF

      - name: Report configured targets
        run: cmake --build build-ios --target help
