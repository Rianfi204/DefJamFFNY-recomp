name: iOS CMake Configure

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - ".github/workflows/ios-configure.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja molten-vk shaderc pkgconf

      - name: Inspect Vulkan and shaderc dependencies
        run: |
          echo "=== Homebrew prefixes ==="
          brew --prefix
          brew --prefix molten-vk
          brew --prefix shaderc
          echo "=== Vulkan files ==="
          find "$(brew --prefix molten-vk)" -maxdepth 5 \\
            \( -name 'vulkan.h' -o -name 'libvulkan*' -o -name 'MoltenVK*' \\) -print
          echo "=== shaderc files ==="
          find "$(brew --prefix shaderc)" -maxdepth 5 \\
            \( -name 'shaderc.h' -o -name 'libshaderc*' \\) -print

      - name: Configure runtime-only build for iOS
        run: |
          cmake -S . -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEFJAM_BUILD_GAME=OFF

      - name: Report configured targets
        run: cmake --build build-ios --target help
