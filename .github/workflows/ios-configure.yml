name: iOS CMake Configure

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - ".github/workflows/ios-configure.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja molten-vk shaderc pkgconf

      - name: Inspect Vulkan and shaderc dependencies
        run: |
          echo "=== Installed packages ==="
          for package in molten-vk shaderc vulkan-headers vulkan-loader pkgconf; do
            echo "--- $package ---"
            brew list --versions "$package" || true
          done
          echo "=== pkg-config ==="
          pkg-config --modversion vulkan || true
          pkg-config --cflags --libs vulkan || true
          pkg-config --modversion shaderc || true
          pkg-config --cflags --libs shaderc || true
          echo "=== Homebrew files ==="
          for directory in /opt/homebrew/Cellar/molten-vk /opt/homebrew/Cellar/vulkan-headers /opt/homebrew/Cellar/vulkan-loader /opt/homebrew/Cellar/shaderc; do
            if [ -d "$directory" ]; then
              find "$directory" -type f \( -name 'vulkan.h' -o -name 'shaderc.h' -o -name 'libvulkan*' -o -name 'libshaderc*' -o -name '*MoltenVK*' \) -print
            else
              echo "Not found: $directory"
            fi
          done

      - name: Configure runtime-only build for iOS
        run: |
          VULKAN_PREFIX="$(brew --prefix molten-vk)"
          SHADERC_PREFIX="$(brew --prefix shaderc)"
          cmake -S . -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEFJAM_BUILD_GAME=OFF \
            -DVulkan_INCLUDE_DIR="$VULKAN_PREFIX/libexec/include" \
            -DVulkan_LIBRARY="$VULKAN_PREFIX/lib/libMoltenVK.a" \
            -DSHADERC_INCLUDE_DIR="$SHADERC_PREFIX/include" \
            -DSHADERC_LIBRARY="$SHADERC_PREFIX/lib/libshaderc_shared.1.dylib"

      - name: Report configured targets
        run: cmake --build build-ios --target help
